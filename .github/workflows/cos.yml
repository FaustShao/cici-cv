name: Deploy portfolio to Tencent COS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tencent-cos-production
  cancel-in-progress: false

jobs:
  deploy:
    # Enable automatic publication only after the bucket and credentials exist.
    # Manual runs also require main, so another branch cannot replace production.
    if: github.ref == 'refs/heads/main' && (vars.COS_ENABLED == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.assemble.outputs.revision }}
    timeout-minutes: 30
    env:
      COS_BUCKET: ${{ vars.COS_BUCKET }}
      COS_REGION: ${{ vars.COS_REGION || 'ap-hongkong' }}
      SITE_BASE_PATH: /
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment settings
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          for name in COS_BUCKET COS_REGION COS_SECRET_ID COS_SECRET_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name. See docs/tencent-cos.md."
              exit 1
            fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: experiments/bruno-projects/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install COS SDK and verify uploader
        run: |
          python -m pip install -r scripts/cos-requirements.txt
          python -m unittest discover -s tests -p 'test_cos_deploy.py'
      - name: Build unified design world
        run: |
          npm ci --prefix experiments/bruno-projects --no-audit --no-fund
          npm run build --prefix experiments/bruno-projects
      - name: Assemble and audit the production artifact
        id: assemble
        run: |
          python scripts/assemble-site.py
          python scripts/audit-site.py public
          python -c "import json; print('revision=' + json.load(open('public/release.json'))['revision'])" >> "$GITHUB_OUTPUT"
      - name: Upload audited website to COS
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: python scripts/deploy-cos.py

  safari-production:
    needs: deploy
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /tests/desktop-browsers.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install selenium==4.35.0 pillow==11.3.0
      - run: sudo safaridriver --enable
      - name: Check the published home scene and exhibit navigation on the custom domain
        env:
          SITE_URL: https://ciciworld.cc/
          SITE_REVISION: ${{ needs.deploy.outputs.revision }}
        run: python tests/desktop-browsers.py safari
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safari-production
          path: browser-*.png
          if-no-files-found: ignore
          retention-days: 7
