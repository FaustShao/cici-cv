name: Deploy resume to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact_id }}
      pages-artifact: ${{ env.PAGES_ARTIFACT_NAME }}
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: experiments/bruno-projects/package-lock.json
      - name: Build unified design world
        run: |
          npm ci --prefix experiments/bruno-projects --no-audit --no-fund
          npm run build --prefix experiments/bruno-projects
      - name: Assemble and audit the production artifact
        run: |
          python scripts/assemble-site.py
          python scripts/audit-site.py public
      - id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy the audited artifact to Pages
        id: deployment
        uses: actions/github-script@v7
        timeout-minutes: 10
        env:
          PAGES_ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
        with:
          retries: 3
          script: |
            const artifact = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifact) || artifact <= 0) {
              throw new Error('The Pages upload did not return an artifact ID');
            }
            const token = await core.getIDToken();
            core.setSecret(token);
            const {data: deployment} = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo, artifact_id: artifact, pages_build_version: context.sha, oidc_token: token
            });
            core.setOutput('page_url', deployment.page_url);
            const terminal = new Set(['deployment_failed', 'deployment_perms_error',
              'deployment_content_failed', 'deployment_cancelled', 'deployment_lost']);
            for (;;) {
              const {data} = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{id}', {
                ...context.repo, id: deployment.id
              });
              if (data.status === 'succeed') return;
              if (terminal.has(data.status)) throw new Error('Pages deployment: ' + data.status);
              await new Promise(resolve => setTimeout(resolve, 5000));
            }

  desktop-browsers:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, browser: edge}
          - {os: windows-latest, browser: chrome}
          - {os: macos-latest, browser: safari}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /tests/desktop-browsers.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.pages-artifact }}
          path: site-artifact
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Open the exact published artifact
        run: python -c "import tarfile; tarfile.open('site-artifact/artifact.tar').extractall('public', filter='data')"
      - run: python -m pip install selenium==4.35.0 pillow==11.3.0
      - if: matrix.browser == 'safari'
        run: sudo safaridriver --enable
      - run: python tests/desktop-browsers.py ${{ matrix.browser }}
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.browser }}
          path: browser-*.png
          if-no-files-found: ignore
          retention-days: 7
