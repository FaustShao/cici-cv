name: Deploy resume to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: experiments/bruno-projects/package-lock.json
      - name: Build unified design world
        run: |
          npm ci --prefix experiments/bruno-projects --no-audit --no-fund
          npm run build --prefix experiments/bruno-projects
      - name: Assemble public files
        run: |
          mkdir public
          cp island.css island-ui.js island-scene.js island-models.js public/
          cp index.html resume.html works.html tideline.html tideline.css tideline.js dream-sentinel.html dream-sentinel.css dream-sentinel.js dream-sentinel-layers.js dream-sentinel-32.js dream-sentinel-32-layers.js dream-sentinel-33.js dream-sentinel-33-layers.js dream-sentinel-34.js dream-sentinel-34-layers.js styles.css site.css site.js resume.js app.js portfolio.html gazette.html portfolio-local.html portfolio.css portfolio.js public/
          cp click-sounds.html site-loader.css site-loader.js public/
          cp gazette-research.css gazette-research.js gazette-research-layout.js public/
          cp gazette-contents.css gazette-contents.js public/
          cp project-ui-zoom.css project-ui-zoom.js public/
          cp -R assets public/
          cp world-resume.css public/
          cp resume-document.css resume-document.js resume-layers.js public/
          cp safepaw.html safepaw.css safepaw.js safepaw-layers.js public/
          cp -R cecilia-world public/cecilia-world
          cp -R legacy-world public/bruno-preview
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: public
      - name: Wait for the uploaded Pages artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            artifact_count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" | jq --arg name "$PAGES_ARTIFACT_NAME" '[.artifacts[] | select(.name == $name)] | length')
            if [ "$artifact_count" = "1" ]; then
              exit 0
            fi
            echo "Waiting for Pages artifact metadata (attempt $attempt/12)."
            sleep 5
          done
          echo "Pages artifact metadata did not become available."
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
