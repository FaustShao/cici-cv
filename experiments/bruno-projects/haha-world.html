<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23ff8d06%27/%3E%3Cpath d=%27M7 19q9 9 18 0%27 fill=%27none%27 stroke=%27white%27 stroke-width=%273%27/%3E%3C/svg%3E" />
  <title>哈哈世界 · VI 手册｜王钰欣</title>
  <meta name="description" content="哈哈世界品牌视觉识别系统：30 页原稿，以横版胶装杂志翻阅。" />
  <link rel="stylesheet" href="/src/haha-world.css" />
</head>
<body>
  <canvas id="paper-field" aria-hidden="true"></canvas>
  <div class="paper-grain" aria-hidden="true"></div>
  <header class="mag-header">
    <a id="back-other" href="hub.html#other" aria-label="返回其他项目">返回其他项目</a>
    <div class="identity"><span>HAHA WORLD</span><span>品牌视觉识别系统手册</span></div>
    <button id="fullscreen" type="button">全屏阅读</button>
  </header>
  <div id="background-cards" aria-label="可拖动的背景纸片">
    <div class="specimen" data-card="h" tabindex="0" aria-label="拖动 h 字母纸片"><span>h.glyph</span><b>h</b></div>
    <div class="specimen" data-card="a" tabindex="0" aria-label="拖动 a 字母纸片"><span>a.glyph</span><b>a</b></div>
    <div class="specimen specimen-smile" data-card="smile" tabindex="0" aria-label="拖动笑脸纸片"><span>哈哈传递</span><b>◡</b></div>
  </div>
  <main id="magazine-stage" aria-label="哈哈世界横版杂志阅读区">
    <img id="cover-poster" src="../assets/haha-world/pages/01.webp" alt="哈哈世界视觉识别系统手册封面" />
    <canvas id="magazine-canvas" tabindex="0" role="application" aria-label="哈哈世界杂志：点击或拖动翻页，方向键翻页，双击放大当前页"></canvas>
    <div id="plain-book" hidden><img id="plain-page" alt="杂志当前页" /></div>
  </main>
  <footer class="mag-footer">
    <div class="credit"><span>哈哈世界 · VI 设计</span><small>刘洋 / 王钰欣 / 吴俊毅 / 傅诗瑶</small></div>
    <p id="reading-hint">点击封面，翻开手册</p>
    <div class="book-tools" aria-label="杂志操作">
      <button id="previous" type="button" aria-label="上一页">上一页</button>
      <button id="contents-trigger" type="button" aria-expanded="false" aria-controls="contents"><span id="page-status">封面</span><span class="contents-label">目录</span></button>
      <button id="next" type="button" aria-label="下一页">翻开</button>
      <button id="zoom-page" type="button">放大</button>
      <button id="close-book" type="button" hidden>合上</button>
    </div>
  </footer>
  <section id="contents" aria-label="手册目录" hidden>
    <div class="contents-heading"><h2>翻到这一页</h2><button id="close-contents" type="button" aria-label="收起目录">收起</button></div>
    <nav id="chapter-links" aria-label="章节"></nav>
    <div id="page-thumbnails"></div>
  </section>
  <dialog id="page-zoom" aria-label="原稿放大阅读">
    <button id="close-zoom" type="button" aria-label="关闭放大">关闭</button>
    <div class="zoom-pages"></div>
    <div class="zoom-tools"><button id="zoom-previous" type="button">上一页</button><button id="detail-minus" type="button" aria-label="缩小原稿">−</button><button id="detail-reset" type="button" aria-label="恢复适合窗口">100%</button><button id="detail-plus" type="button" aria-label="放大原稿">＋</button><span id="zoom-status"></span><button id="zoom-next" type="button">下一页</button></div>
  </dialog>
  <p id="book-feedback" role="status" aria-live="polite"></p>
  <noscript>请启用 JavaScript 翻阅手册。</noscript>
  <script type="module" src="/src/haha-world.js"></script>
</body>
</html>
